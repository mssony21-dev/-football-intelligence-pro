name: Football Intelligence API

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  football-data:
    runs-on: ubuntu-latest

    steps:
      - name: Pobieranie danych API-Football
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          curl -s \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?live=all" \
            -o live.json

      - name: Zapis danych
        uses: actions/upload-artifact@v4
        with:
          name: football-live-data
          path: live.json
