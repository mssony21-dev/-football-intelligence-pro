
name: Football Intelligence API

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  football-data:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie repozytorium
        uses: actions/checkout@v4

      - name: Pobieranie danych API-Football
        env:
          API_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          curl --fail --silent --show-error \
            -H "x-apisports-key: $API_KEY" \
            "https://v3.football.api-sports.io/fixtures?live=all" \
            -o live.json

          jq -e '(.errors | length == 0) and (.response | type == "array")' live.json > /dev/null

      - name: Publikacja wynikow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live.json

          if ! git diff --cached --quiet; then
            git commit -m "Update live football results"
            git push
          fi
